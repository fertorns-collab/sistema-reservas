<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Móvil - SaaS Multi-tenant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased flex flex-col min-h-screen">

    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 id="businessName" class="text-base font-bold tracking-wide">Cargando Negocio...</h1>
            <button onclick="toggleAdminView()" id="adminToggleBtn" class="text-xs bg-emerald-700 hover:bg-emerald-800 px-2.5 py-1.5 rounded-lg uppercase font-semibold transition">Admin</button>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto p-4 flex flex-col justify-center">
        <!-- VISTA CLIENTE: Formulario de Reserva -->
        <div id="clientView" class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Reserva Online</h2>
            <p id="businessSubtitle" class="text-xs text-slate-500 mb-5">Selecciona tu horario y asegura tu espacio.</p>

            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre y Apellidos</label>
                    <input type="text" id="client_name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" placeholder="Tu nombre">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Teléfono Móvil</label>
                    <input type="tel" id="client_phone" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" placeholder="+34 600 000 000">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha</label>
                        <input type="date" id="reservation_date" required class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Turno / Hora</label>
                        <select id="time_slot" class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                            <!-- Generado dinámicamente -->
                        </select>
                    </div>
                </div>

                <div id="partySizeContainer" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Número de Personas</label>
                    <input type="number" id="party_size" value="1" min="1" max="10" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/25 text-sm mt-2 flex items-center justify-center gap-2">
                    🟢 Confirmar y Enviar por WhatsApp
                </button>
            </form>
        </div>

        <!-- VISTA ADMINISTRADOR -->
        <div id="adminView" class="hidden bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Panel de Administración</h2>
            <p class="text-xs text-slate-500 mb-4">Gestiona las reservas de tu negocio.</p>

            <div id="loginSection">
                <form id="loginForm" class="space-y-3">
                    <input type="email" id="adminEmail" placeholder="Correo de administrador" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                    <input type="password" id="adminPassword" placeholder="Contraseña" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                    <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-sm">Iniciar Sesión</button>
                </form>
            </div>

            <div id="dashboardSection" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border">
                    <span class="text-xs font-bold text-emerald-700">🟢 Sesión Activa</span>
                    <button onclick="logoutAdmin()" class="text-xs text-red-600 underline">Cerrar Sesión</button>
                </div>
                <h3 class="text-xs font-bold uppercase text-slate-600">Listado de Reservas Recibidas</h3>
                <div id="reservationsList" class="space-y-2 max-h-80 overflow-y-auto text-xs">
                    <!-- Se cargan dinámicamente -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let tenantData = null;
        const tenantSlug = window.location.pathname.split('/')[1] || 'padel-club';

        async function loadTenant() {
            try {
                const response = await fetch(`/api/tenant/${tenantSlug}`);
                if(response.ok) {
                    tenantData = await response.json();
                    document.getElementById('businessName').innerText = tenantData.name;
                    document.getElementById('businessSubtitle').innerText = `Gestión de ${tenantData.business_type} (Aforo: ${tenantData.max_capacity})`;
                    
                    if(tenantData.business_type === 'restaurant') {
                        document.getElementById('partySizeContainer').classList.remove('hidden');
                    }

                    generateTimeSlots(tenantData.closing_times);
                } else {
                    document.getElementById('businessName').innerText = "Negocio no encontrado";
                }
            } catch (err) {
                console.error("Error cargando tenant:", err);
            }
        }

        // Generar tramos dinámicos (60 o 90 minutos según configuración)
        function generateTimeSlots(closingTimes) {
            const select = document.getElementById('time_slot');
            select.innerHTML = '';
            
            const duration = closingTimes && closingTimes.slotDurationMinutes ? closingTimes.slotDurationMinutes : 90;
            const openHour = 8;
            const closeHour = 22;

            let currentMinutes = openHour * 60;
            const endMinutes = closeHour * 60;

            while (currentMinutes + duration <= endMinutes) {
                const startH = String(Math.floor(currentMinutes / 60)).padStart(2, '0');
                const startM = String(currentMinutes % 60).padStart(2, '0');
                
                currentMinutes += duration;
                
                const endH = String(Math.floor(currentMinutes / 60)).padStart(2, '0');
                const endM = String(currentMinutes % 60).padStart(2, '0');

                const slotText = `${startH}:${startM} - ${endH}:${endM}`;
                const option = document.createElement('option');
                option.value = slotText;
                option.textContent = slotText;
                select.appendChild(option);
            }
        }

        loadTenant();

        // Enviar reserva
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                tenant_id: tenantData.id,
                client_name: document.getElementById('client_name').value,
                client_phone: document.getElementById('client_phone').value,
                reservation_date: document.getElementById('reservation_date').value,
                time_slot: document.getElementById('time_slot').value,
                party_size: document.getElementById('party_size') ? parseInt(document.getElementById('party_size').value) : 1
            };

            try {
                const response = await fetch('/api/reservations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if(result.success) {
                    alert('¡Reserva registrada! Redirigiendo a WhatsApp...');
                    const phoneWp = tenantData.whatsapp_phone || '34600000000';
                    const mensaje = encodeURIComponent(`Hola, acabo de solicitar una reserva para el ${data.reservation_date} a las ${data.time_slot}. Mi nombre es ${data.client_name}.`);
                    window.location.href = `https://wa.me/${phoneWp}?text=${mensaje}`;
                } else {
                    alert('Error al procesar la reserva.');
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión.');
            }
        });

        // Alternar vistas de Administrador
        function toggleAdminView() {
            const clientView = document.getElementById('clientView');
            const adminView = document.getElementById('adminView');
            if(adminView.classList.contains('hidden')) {
                adminView.classList.remove('hidden');
                clientView.classList.add('hidden');
            } else {
                adminView.classList.add('hidden');
                clientView.classList.remove('hidden');
            }
        }

        // Login Admin
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, slug: tenantSlug })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadAdminReservations(data.tenant_id);
                } else {
                    alert('Credenciales incorrectas');
                }
            } catch(err) {
                alert('Error de autenticación');
            }
        });

        async function loadAdminReservations(tenant_id) {
            try {
                const res = await fetch(`/api/admin/reservations/${tenant_id}`);
                const reservations = await res.json();
                const listContainer = document.getElementById('reservationsList');
                listContainer.innerHTML = '';

                if(reservations.length === 0) {
                    listContainer.innerHTML = '<p class="text-slate-400">No hay reservas registradas.</p>';
                    return;
                }

                reservations.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-slate-50 border rounded-xl flex justify-between items-center';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800">${r.client_name} (${r.client_phone})</p>
                            <p class="text-slate-500">${r.reservation_date} - ${r.time_slot} [Plazas: ${r.party_size}]</p>
                            <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${r.status === 'confirmed' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">${r.status}</span>
                        </div>
                        <button onclick="cancelReservation(${r.id})" class="text-red-500 font-bold px-2 py-1 bg-white border rounded shadow-sm">Anular</button>
                    `;
                    listContainer.appendChild(div);
                });
            } catch(err) {
                console.error(err);
            }
        }

        async function cancelReservation(id) {
            if(!confirm('¿Estás seguro de anular esta reserva?')) return;
            const res = await fetch(`/api/reservations/${id}`, { method: 'DELETE' });
            if(res.ok) {
                alert('Reserva anulada.');
                location.reload();
            }
        }

        function logoutAdmin() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
