<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Bookings - Mobile First</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

    <!-- Header Mobile-First -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide">📱 Reservas WhatsApp</h1>
            <span class="text-xs bg-emerald-700 px-2 py-1 rounded-full uppercase font-semibold">Mobile Ready</span>
        </div>
    </header>

    <!-- Contenedor Principal Optimizado para Smartphone -->
    <main class="flex-grow max-w-md w-full mx-auto p-4 flex flex-col justify-center">
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-900 mb-2">Reserva tu espacio</h2>
            <p class="text-sm text-gray-500 mb-6">Completa tus datos para confirmar al instante vía WhatsApp.</p>

            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre y Apellidos</label>
                    <input type="text" id="client_name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" placeholder="Ej. Martí Gómez">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono Móvil</label>
                    <input type="tel" id="client_phone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" placeholder="+34 600 000 000">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha</label>
                        <input type="date" id="reservation_date" required class="w-full px-3 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Hora / Turno</label>
                        <select id="time_slot" class="w-full px-3 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                            <option value="18:00">18:00 - 19:30</option>
                            <option value="19:30">19:30 - 21:00</option>
                            <option value="21:00">21:00 - 22:30</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/25 text-sm mt-2 flex items-center justify-center gap-2">
                    🟢 Confirmar y Enviar por WhatsApp
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-400">
        SaaS Multi-Negocio Optimizado para Smartphones
    </footer>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                tenant_id: 1, // Ejemplo para el primer negocio configurado
                client_name: document.getElementById('client_name').value,
                client_phone: document.getElementById('client_phone').value,
                reservation_date: document.getElementById('reservation_date').value,
                time_slot: document.getElementById('time_slot').value,
                party_size: 1
            };

            try {
                const response = await fetch('/api/reservations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if(result.success) {
                    alert('¡Reserva creada con éxito! Redirigiendo a WhatsApp...');
                    // Redirección automática al flujo wa.me del negocio
                    const mensaje = encodeURIComponent(`Hola, acabo de reservar la pista/mesa para el ${data.reservation_date} a las ${data.time_slot}. Mi nombre es ${data.client_name}.`);
                    window.location.href = `https://wa.me/34600000000?text=${mensaje}`;
                } else {
                    alert('Error al procesar la reserva.');
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            }
        });
    </script>
</body>
</html>
